name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The release notes are the version's section of CHANGELOG.md.
      - name: Release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for $v"; exit 1; }

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The plugin testers install: the zip with the Windows server, and the
      # marketplace.json that pins it, so neither git nor Go is needed.
      - name: Claude Code plugin
        run: |
          v="${GITHUB_REF_NAME#v}"
          exe="$(find dist -type f -name simconnect-mcp.exe | head -n 1)"
          test -n "$exe" || { echo "no Windows binary in dist"; exit 1; }
          bash plugin/package.sh "$v" "$exe" "$RUNNER_TEMP/plugin" \
            "https://github.com/mrlm-net/simconnect-mcp/releases/download/$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/plugin/"*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
