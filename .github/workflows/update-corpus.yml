name: Update SimConnect Corpus

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Scrape and commit corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run scraper
        run: go run ./tools/scraper/ -version both -delay 2s

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet internal/corpus/assets/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add internal/corpus/assets/
          git commit -m "chore(corpus): update SimConnect docs snapshot [skip ci]"
          git push
